#  ╭──────────────────────────────────────────────────────────╮
#  │                      Font Settings                       │
#  ╰──────────────────────────────────────────────────────────╯

# Font Family
font_family      D2CodingLigature Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto

# Font Size
font_size 11
font_features none

force_ltr yes

#  ╭──────────────────────────────────────────────────────────╮
#  │                       Colorscheme                        │
#  ╰──────────────────────────────────────────────────────────╯
active_tab_font_style   bold-italic
inactive_tab_font_style normal
cursor_shape block
shell_integration no-cursor

background_opacity 0.85

cursorColor  #f1ebeb
# BEGIN_KITTY_THEME
# Ayu Mirage
include current-theme.conf
# END_KITTY_THEME

#  ╭──────────────────────────────────────────────────────────╮
#  │                 Scroll Related Settings                  │
#  ╰──────────────────────────────────────────────────────────╯

scrollback_lines 2000
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
scrollback_pager_history_size 0
scrollback_fill_enlarged_window no
wheel_scroll_min_lines 1
# wheel_scroll_multiplier 5.0
# touch_scroll_multiplier 1.0

mouse_hide_wait 3.0

#  ╭──────────────────────────────────────────────────────────╮
#  │                       URL Settings                       │
#  ╰──────────────────────────────────────────────────────────╯
# url_color #0087bd
url_style curly
open_url_with default
url_prefixes file ftp ftps gemini git gopher http https irc ircs kitty mailto news sftp ssh
detect_urls yes

#  ╭──────────────────────────────────────────────────────────╮
#  │                    Clipboard Settings                    │
#  ╰──────────────────────────────────────────────────────────╯

copy_on_select clipboard
map shift+cmd+v paste_from_buffer a1
strip_trailing_spaces smart

#  ╭──────────────────────────────────────────────────────────╮
#  │                     Window Settings                      │
#  ╰──────────────────────────────────────────────────────────╯

remember_window_size  yes
initial_window_width  800
initial_window_height 600

enabled_layouts tall:bias=50;full_size=1;mirrored=false,grid,horizontal,vertical

window_resize_step_cells 2
window_resize_step_lines 2
window_border_width 0.5pt

window_margin_width 0

window_padding_width 0

#  ╭──────────────────────────────────────────────────────────╮
#  │                      Mouse Settings                      │
#  ╰──────────────────────────────────────────────────────────╯

pointer_shape_when_grabbed arrow
default_pointer_shape arrow
pointer_shape_when_dragging arrow

mouse_map  left                 click        ungrabbed              mouse_handle_click selection link prompt
mouse_map  ctrl+shift+left      release      grabbed, ungrabbed     mouse_handle_click link
mouse_map  ctrl+shift+left      press        grabbed                discard_event
mouse_map  left                 press        ungrabbed              mouse_selection normal
mouse_map  ctrl+alt+left        press        ungrabbed              mouse_selection rectangle
mouse_map  left                 doublepress  ungrabbed              mouse_selection word
mouse_map  left                 triplepress  ungrabbed              mouse_selection line
mouse_map  ctrl+alt+left        triplepress  ungrabbed              mouse_selection line_from_point
mouse_map  right                press        ungrabbed              mouse_selection extend
mouse_map  ctrl+shift+right     press        ungrabbed              mouse_show_command_output
# clear_all_mouse_actions no

#  ╭──────────────────────────────────────────────────────────╮
#  │                     Tab Bar Settings                     │
#  ╰──────────────────────────────────────────────────────────╯

tab_bar_edge top
tab_bar_margin_width 0.0
tab_bar_margin_height 2.0 2.0

tab_bar_style powerline

tab_bar_align left

tab_fade 0.25 0.5 0.75 1

tab_separator " |"
tab_powerline_style angled

tab_title_template "{fmt.fg.blue}{bell_symbol}{activity_symbol}{layout_name}{fmt.fg.tab} | {title}"

#  ╭──────────────────────────────────────────────────────────╮
#  │                      MISCELLANEOUS                       │
#  ╰──────────────────────────────────────────────────────────╯

adjust_line_height  0
adjust_column_width 0
adjust_baseline 0

draw_minimal_borders yes

repaint_delay 10

placement_strategy center

inactive_text_alpha 0.8

shell .
editor nvim

####  END OF MISCELLANEOUS  ###################################

#  ╭──────────────────────────────────────────────────────────╮
#  │                 MacOS Specified Settings                 │
#  ╰──────────────────────────────────────────────────────────╯
# macos_titlebar_color system
macos_option_as_alt yes
macos_hide_from_tasks no
macos_quit_when_last_window_closed no
macos_window_resizable yes
macos_thicken_font 0
macos_traditional_fullscreen no
macos_show_window_title_in all
macos_menubar_title_max_length 0
macos_custom_beam_cursor no
macos_traditional_fullscreen no

#  ╭──────────────────────────────────────────────────────────╮
#  │                       KeyBindings                        │
#  ╰──────────────────────────────────────────────────────────╯

kitty_mod ctrl+shift

map kitty_mod+c             copy_to_clipboard
map kitty_mod+v             paste_from_clipboard
map kitty_mod+s             paste_from_selection

map kitty_mod+up            scroll_line_up
map kitty_mod+down          scroll_line_down
map kitty_mod+page_up       scroll_page_up
map kitty_mod+page_down     scroll_page_down
map kitty_mod+home          scroll_home
map kitty_mod+end           scroll_end

map kitty_mod+w>n           new_window
map kitty_mod+w>q           close_window
map kitty_mod+w>o>n         new_os_window
map kitty_mod+w>o>q         close_os_window
map kitty_mod+w>v           focus_visible_window
map kitty_mod+w>s           swap_with_window

map kitty_mod+]             next_window
map kitty_mod+[             previous_window

map kitty_mod+k             move_window_forward
map kitty_mod+j             move_window_backward
map kitty_mod+`             move_window_to_top

map kitty_mod+r             load_config_file

map ctrl+cmd+1              goto_tab 1
map ctrl+cmd+2              goto_tab 2
map ctrl+cmd+3              goto_tab 3
map ctrl+cmd+4              goto_tab 4
map ctrl+cmd+5              goto_tab 5
map ctrl+cmd+6              goto_tab 6
map ctrl+cmd+7              goto_tab 7
map ctrl+cmd+8              goto_tab 8
map ctrl+cmd+9              goto_tab 9

map ctrl+cmd+t              new_tab_with_cwd
map ctrl+shift+cmd+t        set_tab_title

map alt+tab                 next_tab
map alt+shift+tab           previous_tab

map kitty_mod+z>n           new_tab
map kitty_mod+z>q           close_tab
map kitty_mod+w             close_tab

map kitty_mod+equal         change_font_size all +2.0
map kitty_mod+plus          change_font_size all +2.0
map kitty_mod+minus         change_font_size all -2.0
map kitty_mod+backspace     change_font_size all 0

map kitty_mod+u             kitten unicode_input
map kitty_mod+f2            edit_config_file

# map kitty_mod+h launch --location=hsplit
# map kitty_mod+v launch --location=vsplit
map kitty_mod+enter         launch --location=split --cwd=current
map alt+shift+enter         launch --location=split --cwd=current
map kitty_mod+l             next_layout

# Move the active window in the indicated direction
map ctrl+alt+shift+up       move_window up
map ctrl+alt+shift+left     move_window left
map ctrl+alt+shift+right    move_window right
map ctrl+alt+shift+down     move_window down

map ctrl+cmd+left          neighboring_window left
map ctrl+cmd+right         neighboring_window right
map ctrl+cmd+up            neighboring_window up
map ctrl+cmd+down          neighboring_window down

map kitty_mod+left resize_window narrower
map kitty_mod+right resize_window wider
map kitty_mod+up resize_window taller
map kitty_mod+down resize_window shorter

